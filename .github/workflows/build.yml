name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Extrair o zip
        run: |
          mkdir -p work
          unzip -o ./*.zip -d work

      - name: Build
        run: |
          cd "$(dirname "$(find work -name build.gradle | head -n 1)")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: imdd-relics
          path: |
            work/**/build/libs/*.jar
            !work/**/build/libs/*-sources.jar
